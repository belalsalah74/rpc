name: Build Morphe Patch

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build native payloads
        run: |
          cmake -S native -B build/native \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28
          cmake --build build/native --config Release --parallel
          mkdir -p patches/src/main/resources/pgo/arm64-v8a
          cp build/native/libmain.so patches/src/main/resources/pgo/arm64-v8a/libmain.so
          cp build/native/libpgo_rpc_probe.so patches/src/main/resources/pgo/arm64-v8a/libpgo_rpc_probe.so
      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-go-rpc-probe-mpp
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
          retention-days: 7
